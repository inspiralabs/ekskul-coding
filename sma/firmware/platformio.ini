; Buka folder ini lewat PlatformIO: PIO Home -> Open Project -> pilih folder firmware ini.
; Library DHT otomatis terpasang saat Build pertama kali.
[platformio]
src_dir = .

[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip  ; sama dengan yang dipasang di P2
board = esp32dev            ; ganti kalau board kelompokmu berbeda
framework = arduino
monitor_speed = 115200      ; harus sama dengan Serial.begin(115200)
lib_deps = adafruit/DHT sensor library
