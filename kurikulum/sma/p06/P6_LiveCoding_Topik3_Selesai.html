<!DOCTYPE html>
<html>
<head>
    <title>Mini Dashboard Suhu</title>
</head>
<body>
    <h1>Mini Dashboard Suhu</h1>

    <form>
        <label for="ambangBatas">Set Ambang Batas Suhu (°C):</label>
        <input type="number" id="ambangBatas" placeholder="Contoh: 30">

        <label for="modeFan">Mode Fan:</label>
        <select id="modeFan">
            <option value="manual">Manual</option>
            <option value="otomatis">Otomatis</option>
        </select>

        <button type="button">Simpan</button>
    </form>
