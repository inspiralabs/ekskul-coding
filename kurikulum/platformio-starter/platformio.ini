; Proyek starter ESP32 untuk semua pertemuan P10–P13.
; Cara pakai: PIO Home -> Open Project -> pilih folder ini,
; lalu salin isi file P{n}_x_....cpp / C{n}_....cpp ke src/main.cpp.
[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32dev            ; ganti kalau board kelompokmu berbeda
framework = arduino
monitor_speed = 115200      ; harus sama dengan Serial.begin(115200)
lib_deps = adafruit/DHT sensor library
