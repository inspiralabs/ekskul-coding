# Deploy backend ke VPS Inspiralabs (app: api-ekskulcoding → https://api-ekskulcoding.inspiralabs.id).
# Situs statis di root tetap di Vercel; file ini diabaikan Vercel (.vercelignore).
services:
  api:
    build: ./backend
    env_file:
      - path: .env                 # di server: sudo -u deploy nano /srv/apps/api-ekskulcoding/.env
        required: false
    environment:
      PORT: "3000"
    expose: ["3000"]
    restart: unless-stopped
    networks: [edge]
    labels:
      - traefik.enable=true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Website kelompok IoT (smp-01..13, sma-01..06).inspiralabs.id, isi dari folder kelompok/.
  kelompok:
    image: nginx:1.27-alpine
    volumes:
      - ./kelompok:/usr/share/nginx/html:ro
      - ./deploy/kelompok.nginx.conf:/etc/nginx/conf.d/default.conf:ro
    expose: ["80"]
    restart: unless-stopped
    networks: [edge]
    labels:
      - traefik.enable=true
      - traefik.http.routers.ekskul-kelompok.rule=HostRegexp(`^(smp|sma)-[0-9]{2}\.inspiralabs\.id$`)
      - traefik.http.services.ekskul-kelompok.loadbalancer.server.port=80
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  edge:
    external: true
