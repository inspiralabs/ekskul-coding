# Website kelompok IoT: <id>.inspiralabs.id -> /var/www/ekskul/<id>/
# Cloudflare Tunnel (route *.inspiralabs.id -> http://127.0.0.1:80) sudah mengurus HTTPS,
# jadi cukup port 80. Nama ditulis lengkap (exact) supaya menang atas blok nginx lain
# yang memakai wildcard *.inspiralabs.id. Kelompok baru: tambah nama di server_name.

map $host $kelompok {
    ~^(?<k>(smp|sma)-\d\d)\.inspiralabs\.id$  $k;
}

server {
    listen 80;
    server_name
                smp-01.inspiralabs.id
                smp-02.inspiralabs.id
                smp-03.inspiralabs.id
                smp-04.inspiralabs.id
                smp-05.inspiralabs.id
                smp-06.inspiralabs.id
                smp-07.inspiralabs.id
                smp-08.inspiralabs.id
                smp-09.inspiralabs.id
                smp-10.inspiralabs.id
                smp-11.inspiralabs.id
                smp-12.inspiralabs.id
                smp-13.inspiralabs.id
                sma-01.inspiralabs.id
                sma-02.inspiralabs.id
                sma-03.inspiralabs.id
                sma-04.inspiralabs.id
                sma-05.inspiralabs.id
                sma-06.inspiralabs.id
                ;

    root /var/www/ekskul/$kelompok;
    index index.html;

    location / { try_files $uri $uri/ =404; }
}
