# Website kelompok IoT: <id>.inspiralabs.id -> kelompok/<id>/ di repo.
map $host $kelompok {
    ~^(?<k>(smp|sma)-\d\d)\.inspiralabs\.id$  $k;
    default                                    "";
}

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html/$kelompok;
    index index.html;

    location = /health { return 200 "ok\n"; }
    location / { try_files $uri $uri/ =404; }
}
