<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leaderboard - Ekskul Coding Asy Syahid</title>
<link rel="icon" href="/icon.webp" type="image/webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared/site.css">
<style>
  .kelas-toggle{margin-bottom:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:6px 4px;overflow-x:auto}
  .leaderboard-table{width:100%;border-collapse:collapse;font-size:15px}
  .leaderboard-table th{text-align:left;padding:12px 10px;color:var(--muted);font-size:13px;font-weight:800;border-bottom:2px solid var(--line)}
  .leaderboard-table td{padding:12px 10px;border-bottom:1px solid var(--line);font-weight:600}
  .leaderboard-table tr:last-child td{border-bottom:none}
  .leaderboard-table td:first-child{white-space:nowrap;font-weight:800;width:1%}
  .leaderboard-table td:nth-child(3),.leaderboard-table th:nth-child(3){text-align:right;font-variant-numeric:tabular-nums}
  .leaderboard-table td:nth-child(3){font-weight:800}
  .leaderboard-table td:nth-child(4),.leaderboard-table th:nth-child(4){text-align:center}
  /* Tiga besar dapat latar hangat supaya podium terlihat sekilas. */
  .leaderboard-table tbody tr:nth-child(-n+3) td{background:#FFF1DF}
  @media (max-width:420px){
    .leaderboard-table th,.leaderboard-table td{padding:11px 6px}
  }
  .keterangan{color:var(--muted);font-size:14px;font-weight:600;margin:12px 2px 0}
</style>
</head>
<body>
<header class="situs-header"><div class="wadah">
  <a class="merek" href="/"><img src="/logo.jpeg" alt="" width="34" height="34">Ekskul Coding</a>
  <nav class="nav" aria-label="Menu utama">
    <a href="/materi/">Materi</a><a href="/leaderboard/" aria-current="page">Leaderboard</a><a href="/#kelompok">Kelompok</a><a href="/tentang/">Tentang</a>
  </nav>
</div></header>

<main class="wadah wadah-sempit">
  <div class="judul-halaman">
    <h1>Leaderboard</h1>
    <p>Ranking siswa dari nilai akhir di gradebook tutor.</p>
  </div>

  <div class="kelas-toggle pilih-kelas" role="group" aria-label="Pilih jenjang">
    <button type="button" data-kelas="smp">SMP</button>
    <button type="button" data-kelas="sma">SMA</button>
  </div>

  <div class="card">
    <div id="leaderboard-container" aria-live="polite"></div>
  </div>
  <p class="keterangan">Nama atau nilai salah? Bilang ke tutor saat pertemuan.</p>
</main>

<footer class="situs-footer"><div class="wadah">
  <span>InspiraLabs × Sekolah Qur'an Asy Syahid</span>
  <a href="/tentang/">Tentang ekskul ini</a>
</div></footer>

<script src="/shared/csv.js"></script>
<script src="leaderboard.js"></script>
</body>
</html>
