<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Materi - Ekskul Coding Asy Syahid</title>
<link rel="icon" href="/icon.webp" type="image/webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared/site.css">
<style>
  .pilih-kelas{margin-bottom:18px}
  .materi-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px}
  .materi-toggle{width:100%;min-height:64px;border:none;background:none;cursor:pointer;font-family:inherit;text-align:left;display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:var(--r)}
  .materi-head{flex:1;display:flex;flex-direction:column;gap:2px}
  .materi-head strong{font:800 18px/1.25 'Baloo 2',sans-serif;color:var(--ink)}
  .materi-tanggal{font-size:13px;font-weight:700;color:var(--muted)}
  .panah{color:var(--muted);font-size:20px;transition:transform .2s ease}
  .materi-toggle[aria-expanded="true"] .panah{transform:rotate(90deg);color:var(--ink)}
  .materi-body{display:none;flex-wrap:wrap;gap:10px;padding:0 16px 16px}
  .materi-body.open{display:flex}
  .drive-btn,.form-btn{display:inline-flex;align-items:center;min-height:44px;padding:10px 16px;border-radius:var(--r-sm);
    color:var(--ink);text-decoration:none;font:800 15px 'Nunito',sans-serif}
  .drive-btn{background:var(--orange)}
  .form-btn{background:var(--mint)}
  .drive-btn:hover,.form-btn:hover{filter:brightness(1.05)}
  #materi-container .status-msg{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
</style>
</head>
<body>
<header class="situs-header"><div class="wadah">
  <a class="merek" href="/"><img src="/logo.jpeg" alt="" width="34" height="34">Ekskul Coding</a>
  <nav class="nav" aria-label="Menu utama">
    <a href="/materi/" aria-current="page">Materi</a><a href="/leaderboard/">Leaderboard</a><a href="/#kelompok">Kelompok</a><a href="/tentang/">Tentang</a>
  </nav>
</div></header>

<main class="wadah wadah-sempit">
  <div class="judul-halaman">
    <h1>Materi <span id="kelas-label"></span></h1>
    <p>Slide, post-test, dan kritik &amp; saran tiap pertemuan. Ketuk judul pertemuan untuk membuka tautannya. Materi baru muncul setelah tutor mengunggahnya.</p>
  </div>

  <nav class="pilih-kelas" aria-label="Pilih jenjang">
    <a href="?kelas=smp" data-kelas="smp">SMP</a>
    <a href="?kelas=sma" data-kelas="sma">SMA</a>
  </nav>

  <div id="materi-container" aria-live="polite"></div>
</main>

<footer class="situs-footer"><div class="wadah">
  <span>InspiraLabs × Sekolah Qur'an Asy Syahid</span>
  <a href="/tentang/">Tentang ekskul ini</a>
</div></footer>

<script>
  // Tandai jenjang aktif; aturannya sama dengan materi.js (selain "smp" berarti SMA).
  (function () {
    var kelas = new URLSearchParams(location.search).get('kelas') === 'smp' ? 'smp' : 'sma';
    document.querySelector('.pilih-kelas [data-kelas="' + kelas + '"]').setAttribute('aria-current', 'page');
  })();
</script>
<script src="/shared/csv.js"></script>
<script src="materi.js"></script>
</body>
</html>
